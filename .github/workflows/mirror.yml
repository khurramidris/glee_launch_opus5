name: Upload AI files to the mirror

# Copies every file in the resource manifest to a Cloudflare R2 bucket (or any
# S3-compatible storage) under <sha256>/<file name>. Run it from the Actions tab
# after changing the manifest. Requires these repository settings:
#   secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables: R2_BUCKET (and optionally R2_PREFIX, for example "glee/")
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download and verify every pinned file
        run: node scripts/resources.mjs mirror mirror-out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TARGET: s3://${{ vars.R2_BUCKET }}/${{ vars.R2_PREFIX }}
        run: |
          aws s3 cp mirror-out "$TARGET" --recursive --endpoint-url "$ENDPOINT" --cache-control "public, max-age=31536000, immutable"
          echo "::notice title=Mirror uploaded::Set the repository variable GLEE_DOWNLOAD_MIRROR to your bucket's public URL${{ vars.R2_PREFIX && ' plus ' || '' }}${{ vars.R2_PREFIX }} and build a new release."
