name: Release

# Builds the Windows installer and the macOS disk image and attaches them to a
# draft GitHub release named after the app version. Start it from the Actions
# tab (Release -> Run workflow) or by pushing a tag such as v0.1.0. Publishing
# the draft creates the version tag if it doesn't exist yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Versions match (and the tag, if any)
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/verify-release-version.mjs
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${version}" || { echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${version}"; exit 1; }
          fi
      - run: node scripts/resources.mjs check
      - run: node scripts/update-source.mjs check

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Add macOS targets
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Use the download mirror when configured
        if: vars.GLEE_DOWNLOAD_MIRROR != ''
        run: node scripts/resources.mjs set-mirror "${{ vars.GLEE_DOWNLOAD_MIRROR }}"
      - name: Point update checks at this repository's releases
        shell: bash
        run: node scripts/update-source.mjs set "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
      - name: Load optional signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export credentials that exist, so unsigned builds still work.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ] && [ "$RUNNER_OS" = "macOS" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: Glee __VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Download

            - **Windows 10/11 (64-bit):** the `x64-setup.exe` file
            - **macOS 14 or newer (Apple Silicon and Intel):** the `universal.dmg` file

            On first launch Glee downloads its AI model and engine once (about 1.3 GB). After that it works offline.

            ### First launch on an unsigned build
            - **Windows:** if SmartScreen says "Windows protected your PC", click **More info → Run anyway**.
            - **macOS:** if macOS says Glee can't be opened, open **System Settings → Privacy & Security** and click **Open Anyway**.

  update-manifest:
    name: Publish update manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Generate latest.json and attach it to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_SUPPORTED_VERSION: ${{ vars.GLEE_MIN_SUPPORTED_VERSION }}
        run: |
          # Draft releases have no tag URL, so find the draft in the release list.
          version=$(node -p "require('./package.json').version")
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"v${version}\")][0] // empty" > release.json
          test -s release.json || { echo "::error::No draft release found for v${version}"; exit 1; }
          node scripts/make-update-manifest.mjs --release release.json --repo "${GITHUB_REPOSITORY}" \
            --out latest.json --min-supported "${MIN_SUPPORTED_VERSION}"
          # Replace an older latest.json (for example after re-running the workflow).
          for id in $(jq -r '.assets[] | select(.name == "latest.json") | .id' release.json); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          upload_url=$(jq -r '.upload_url' release.json | sed 's/{.*}//')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "${upload_url}?name=latest.json"
