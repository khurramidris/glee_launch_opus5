name: Model smoke test

# Downloads the exact model and engine files pinned in the resource manifest,
# verifies them, and chats with the model using Glee's launch flags. Runs
# weekly too, so a file removed upstream is noticed before users are.
on:
  push:
    paths:
      - src-tauri/resources/manifest.json
      - src-tauri/src/runtime_selection.rs
      - src/features/chat/**
      - scripts/resources.mjs
      - .github/workflows/model-smoke.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            eval: ""
          - os: windows-latest
            eval: ""
          # The eval sends Glee's real prompts through the model; the macOS
          # runner is the fastest CPU GitHub offers.
          - os: macos-latest
            eval: "--eval"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/resources.mjs check
      - run: node scripts/resources.mjs smoke ${{ matrix.eval }}
